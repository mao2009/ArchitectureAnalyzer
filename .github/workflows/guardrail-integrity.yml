name: Guardrail integrity

# Solo-maintainer protected-path sign-off. After bootstrap this runs from main,
# never using an untrusted PR checkout with pull_request_target privileges.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  protected-change-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Audit diff and require solo sign-off for protected changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch --no-tags origin \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/pr-head"
          git diff --name-only -z HEAD...refs/remotes/pr-head > "$RUNNER_TEMP/guard-diff.z"
          protected=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/*|.github/CODEOWNERS|scripts/*|src/*|tests/agent_guard/*|Directory.Build.*|Directory.Packages.props|*.csproj|*.props|*.targets|*.editorconfig|*.globalconfig|*/architecture.contract.json|architecture.contract.json)
                echo "Guardrail change: $path"
                protected=true ;;
            esac
          done < "$RUNNER_TEMP/guard-diff.z"
          if [[ "$protected" == "false" ]]; then
            echo "No guardrail-affecting changes"
            exit 0
          fi
          python3 scripts/solo_maintainer_approval.py \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --head "$PR_HEAD_SHA" --owner "$REPO_OWNER"
