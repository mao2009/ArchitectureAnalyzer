name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build, test and verify the architecture gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Matches the SDK the repository is developed and verified against locally.
          dotnet-version: '10.0.302'

      - name: Restore
        run: dotnet restore ArchitectureAnalyzer.sln

      - name: Build
        # tests/GateVerification/SampleConsumer is intentionally not in the solution, so this
        # step is unaffected by the gate verification below.
        run: dotnet build ArchitectureAnalyzer.sln --no-restore

      - name: Test
        # Solution-wide, so the unit tests and the cross-analyzer parity suite
        # (tests/CompatibilitySuite) both run on every push and pull request. The parity suite
        # needs no network access to PSXRecompStudio: its baseline analyzer is a pinned in-repo
        # copy. See docs/compatibility/compatibility-suite.md.
        run: dotnet test ArchitectureAnalyzer.sln --no-build

      - name: Verify architecture gate (real dotnet build)
        # The proof that a contract violation actually fails a build, not just a test harness.
        run: |
          chmod +x tests/GateVerification/verify-gate.sh
          tests/GateVerification/verify-gate.sh

      - name: Verify multi-project contract isolation
        # Analyzer reference is shared across projects; contracts remain compilation-local.
        run: |
          chmod +x tests/MultiProjectGate/verify-multi-project.sh
          tests/MultiProjectGate/verify-multi-project.sh

      - name: Restore representative performance benchmark
        run: dotnet restore tests/PerformanceBenchmark/ArchitectureAnalyzer.PerformanceBenchmark.csproj

      - name: Representative performance regression guard
        # Uses structural assertions plus generous wall-clock budgets. The budgets intentionally
        # catch order-of-magnitude regressions rather than normal shared-runner noise.
        run: >-
          dotnet run
          --project tests/PerformanceBenchmark/ArchitectureAnalyzer.PerformanceBenchmark.csproj
          --configuration Release
          --no-restore
          --
          --ci


  package-consumer-e2e:
    name: Packaged consumer E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Verify packaged analyzer consumer E2E (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/PackageConsumer/verify-package-consumer.sh

      - name: Verify packaged analyzer consumer E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/PackageConsumer/verify-package-consumer.ps1
