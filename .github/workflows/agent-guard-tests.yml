name: Agent guard regression tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline strict gate fixture tests
        run: python -m unittest discover -s tests/agent_guard -p 'test_strict_diagnostic_audit.py' -v
